services:
  php:
    build:
      context: .
      dockerfile: docker/php/Dockerfile
    container_name: task-planner-php
    working_dir: /var/www
    volumes:
      - ./src:/var/www

  nginx:
    image: nginx:alpine
    container_name: task-planner-nginx
    restart: unless-stopped
    ports:
      - "80:80"
    volumes:
      - ./src:/var/www
      - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - php

  postgres:
    image: postgres:17
    container_name: task-planner-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: task_planner
      POSTGRES_USER: task_planner
      POSTGRES_PASSWORD: secret
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  pgadmin:
    image: dpage/pgadmin4:latest
    container_name: task-planner-pgadmin
    restart: unless-stopped
    environment:
      PGADMIN_DEFAULT_EMAIL: admin@taskplanner.com
      PGADMIN_DEFAULT_PASSWORD: secret
    ports:
      - "8080:80"
    volumes:
      - pgadmin_data:/var/lib/pgadmin
    depends_on:
      - postgres

volumes:
  postgres_data:
  pgadmin_data: